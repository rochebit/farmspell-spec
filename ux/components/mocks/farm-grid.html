<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmGrid Component Mock</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .showcase-container {
      max-width: 720px;
      margin: 32px auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* 5x5 Farm Grid Container */
    .farm-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      background: var(--color-farm-green-main);
      padding: 16px;
      border-radius: var(--radius-lg);
      border: 4px solid var(--color-farm-green-dark);
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      max-width: 580px;
      width: 100%;
    }

    /* Plot Tile */
    .grid-plot {
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-md);
      border: 3px solid var(--color-soil-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
      transition: transform var(--duration-instant);
    }
    .grid-plot:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    }

    .plot-dry { background: radial-gradient(circle, #A1887F 0%, var(--color-soil-dry) 100%); }
    .plot-wet { background: radial-gradient(circle, #5D4037 0%, var(--color-soil-wet) 100%); }
    .plot-withered { background: radial-gradient(circle, #90A4AE 0%, var(--color-withered-gray) 100%); filter: grayscale(0.5); }
    .plot-ready { animation: pulseGlow 1.8s infinite; border-color: var(--color-coin-gold); }

    .crop-icon { font-size: 32px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
    .plot-subtext {
      position: absolute;
      bottom: 4px;
      font-size: 10px;
      font-weight: 700;
      color: white;
      background: rgba(0,0,0,0.55);
      border-radius: 4px;
      padding: 1px 4px;
    }
  </style>
</head>
<body>
  <div class="showcase-container glass-card">
    <div style="text-align: center;">
      <h2>Component Mock: FarmGrid (5x5 Grid)</h2>
      <p style="color: var(--color-text-muted); font-size: 15px; margin-top: 4px;">25 interactive farm plot tiles in responsive 5x5 arrangement.</p>
    </div>

    <!-- 5x5 Farm Grid -->
    <div class="farm-grid">
      <!-- Row 1 -->
      <div class="grid-plot plot-dry"><span style="opacity: 0.3; font-size: 20px;">➕</span></div>
      <div class="grid-plot plot-wet"><span class="crop-icon">🌱</span><span class="plot-subtext">0/2</span></div>
      <div class="grid-plot plot-wet"><span class="crop-icon">🥕</span><span class="plot-subtext">1/2</span></div>
      <div class="grid-plot plot-wet plot-ready"><span class="crop-icon">🥕</span><span class="plot-subtext" style="background: var(--color-coin-gold); color: #2D231E;">READY</span></div>
      <div class="grid-plot plot-dry"><span style="opacity: 0.3; font-size: 20px;">➕</span></div>

      <!-- Row 2 -->
      <div class="grid-plot plot-wet"><span class="crop-icon">🍅</span><span class="plot-subtext">1/2</span></div>
      <div class="grid-plot plot-dry"><span class="crop-icon">🍅</span><span class="plot-subtext" style="background: var(--color-feedback-warning);">WATER ME</span></div>
      <div class="grid-plot plot-wet"><span class="crop-icon">🌱</span><span class="plot-subtext">0/2</span></div>
      <div class="grid-plot plot-dry"><span style="opacity: 0.3; font-size: 20px;">➕</span></div>
      <div class="grid-plot plot-wet"><span class="crop-icon">🌽</span><span class="plot-subtext">1/3</span></div>

      <!-- Row 3 -->
      <div class="grid-plot plot-dry"><span style="opacity: 0.3; font-size: 20px;">➕</span></div>
      <div class="grid-plot plot-wet"><span class="crop-icon">🌽</span><span class="plot-subtext">2/3</span></div>
      <div class="grid-plot plot-wet plot-ready"><span class="crop-icon">🌽</span><span class="plot-subtext" style="background: var(--color-coin-gold); color: #2D231E;">READY</span></div>
      <div class="grid-plot plot-wet"><span class="crop-icon">🍓</span><span class="plot-subtext">2/3</span></div>
      <div class="grid-plot plot-dry"><span style="opacity: 0.3; font-size: 20px;">➕</span></div>

      <!-- Row 4 -->
      <div class="grid-plot plot-withered"><span class="crop-icon" style="filter: grayscale(1);">🥀</span><span class="plot-subtext" style="background: var(--color-record-red);">CLEAR</span></div>
      <div class="grid-plot plot-dry"><span style="opacity: 0.3; font-size: 20px;">➕</span></div>
      <div class="grid-plot plot-wet"><span class="crop-icon">🎃</span><span class="plot-subtext">1/4</span></div>
      <div class="grid-plot plot-wet"><span class="crop-icon">🎃</span><span class="plot-subtext">2/4</span></div>
      <div class="grid-plot plot-wet plot-ready"><span class="crop-icon">🍓</span><span class="plot-subtext" style="background: var(--color-coin-gold); color: #2D231E;">READY</span></div>

      <!-- Row 5 -->
      <div class="grid-plot plot-dry"><span style="opacity: 0.3; font-size: 20px;">➕</span></div>
      <div class="grid-plot plot-dry"><span style="opacity: 0.3; font-size: 20px;">➕</span></div>
      <div class="grid-plot plot-wet"><span class="crop-icon">🌱</span><span class="plot-subtext">0/2</span></div>
      <div class="grid-plot plot-dry"><span style="opacity: 0.3; font-size: 20px;">➕</span></div>
      <div class="grid-plot plot-dry"><span style="opacity: 0.3; font-size: 20px;">➕</span></div>
    </div>
  </div>
</body>
</html>
