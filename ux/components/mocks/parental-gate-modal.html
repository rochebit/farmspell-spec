<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParentalGateModal Component Mock</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--color-surface-overlay);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .gate-box {
      background: var(--color-surface-card);
      border-radius: var(--radius-lg);
      border: 4px solid var(--color-soil-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      max-width: 440px;
      width: 100%;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .question-plaque {
      background: #EDE7F6;
      border: 2px solid #673AB7;
      padding: 12px 28px;
      border-radius: var(--radius-md);
      font-size: 28px;
      font-weight: 700;
      color: #311B92;
    }

    .answer-display {
      width: 100%;
      height: 56px;
      background: #FFFFFF;
      border: 2px solid #B0BEC5;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .keypad-btn {
      min-height: 56px;
      font-size: 22px;
      font-weight: 700;
      border-radius: var(--radius-md);
      border: 2px solid #CFD8DC;
      background: #FFFFFF;
      cursor: pointer;
      box-shadow: 0 4px 0 #B0BEC5;
      transition: transform var(--duration-instant);
    }
    .keypad-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #B0BEC5;
    }
  </style>
</head>
<body>
  <div class="modal-backdrop">
    <div class="gate-box">
      <div style="text-align: center;">
        <h2 style="font-size: 24px;">🔒 Grown-Ups Only</h2>
        <span style="font-size: 14px; color: var(--color-text-muted);">Please solve this math question to enter settings:</span>
      </div>

      <!-- Question Plaque -->
      <div class="question-plaque">
        7 × 8 = ?
      </div>

      <!-- Answer Input Box -->
      <div class="answer-display">
        56
      </div>

      <!-- Number Keypad -->
      <div class="keypad-grid">
        <button class="keypad-btn">1</button>
        <button class="keypad-btn">2</button>
        <button class="keypad-btn">3</button>
        <button class="keypad-btn">4</button>
        <button class="keypad-btn">5</button>
        <button class="keypad-btn">6</button>
        <button class="keypad-btn">7</button>
        <button class="keypad-btn">8</button>
        <button class="keypad-btn">9</button>
        <button class="keypad-btn" style="background: #FFEBEE; color: var(--color-record-red);">C</button>
        <button class="keypad-btn">0</button>
        <button class="keypad-btn" style="background: #E8F5E9; color: var(--color-farm-green-dark);">✓</button>
      </div>

      <button class="btn-tactile" style="min-height: 40px; padding: 6px 16px; background: transparent; font-size: 15px; color: var(--color-text-muted);">Cancel</button>
    </div>
  </div>
</body>
</html>
