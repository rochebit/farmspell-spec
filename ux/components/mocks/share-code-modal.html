<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareCodeModal Component Mock</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--color-surface-overlay);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .share-box {
      background: var(--color-surface-card);
      border-radius: var(--radius-lg);
      border: 4px solid var(--color-coin-gold);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      max-width: 480px;
      width: 100%;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    .code-display {
      background: #FFF8E1;
      border: 3px dashed var(--color-coin-gold-dark);
      border-radius: var(--radius-md);
      padding: 16px 32px;
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #E65100;
      font-variant-numeric: tabular-nums;
    }

    .timer-badge {
      background: #ECEFF1;
      color: var(--color-text-muted);
      font-size: 14px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: var(--radius-full);
    }
  </style>
</head>
<body>
  <div class="modal-backdrop">
    <div class="share-box">
      <div>
        <h2 style="font-size: 24px;">🔗 Connect to Child's Farm</h2>
        <p style="font-size: 14px; color: var(--color-text-muted); margin-top: 6px;">Show this code to the parent managing the farm. They can enter it in Child Settings to add you:</p>
      </div>

      <!-- 6-Digit Join Code Plaque -->
      <div class="code-display">
        JOIN-8492
      </div>

      <div class="timer-badge">
        ⏱️ Code expires in 14:32
      </div>

      <!-- Buttons -->
      <div style="display: flex; gap: 12px; width: 100%; justify-content: center;">
        <button class="btn-tactile btn-gold" style="font-size: 17px;">📋 Copy Code</button>
        <button class="btn-tactile btn-blue" style="font-size: 17px;">🔄 Refresh</button>
      </div>

      <button class="btn-tactile" style="min-height: 40px; background: transparent; font-size: 15px; color: var(--color-text-muted);">Done</button>
    </div>
  </div>
</body>
</html>
