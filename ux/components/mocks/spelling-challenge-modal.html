<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpellingChallengeModal Component Mock</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--color-surface-overlay);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      background: var(--color-surface-card);
      border-radius: var(--radius-lg);
      border: 4px solid var(--color-farm-green-main);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      max-width: 580px;
      width: 100%;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      position: relative;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    /* Attempts */
    .attempts-row {
      display: flex;
      gap: 8px;
      font-size: 24px;
    }

    /* Audio Speaker Button */
    .speaker-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      font-size: 32px;
      background: var(--color-sky-blue);
      box-shadow: 0 6px 0 var(--color-sky-blue-dark);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--duration-instant);
    }
    .speaker-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--color-sky-blue-dark);
    }

    /* Word Slots */
    .slots-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 8px 0;
    }

    .letter-slot {
      width: 60px;
      height: 72px;
      border-radius: var(--radius-md);
      border: 3px solid var(--color-soil-border);
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: var(--color-text-primary);
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.08);
      position: relative;
    }

    .slot-active {
      border-color: var(--color-sky-blue);
      box-shadow: 0 0 12px rgba(41, 182, 246, 0.5);
    }
    .slot-active::after {
      content: '';
      position: absolute;
      bottom: 8px;
      width: 24px;
      height: 4px;
      background: var(--color-sky-blue);
      border-radius: 2px;
      animation: pulseGlow 1s infinite;
    }

    /* Controls */
    .modal-actions {
      display: flex;
      gap: 16px;
      width: 100%;
      justify-content: center;
    }

    .cancel-link {
      background: none;
      border: none;
      color: var(--color-text-muted);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="modal-backdrop">
    <div class="modal-box">
      <!-- Header -->
      <div class="modal-header">
        <h2 style="font-size: 26px; color: var(--color-text-primary);">Spell to Water Plot! 💧</h2>
        <div class="attempts-row" title="3 Attempts Allowed">
          <span>⭐</span>
          <span>⭐</span>
          <span style="opacity: 0.3;">⭐</span>
        </div>
      </div>

      <!-- Spoken Word Trigger -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <button class="speaker-btn" title="Tap to listen to word">🔊</button>
        <span style="font-size: 15px; font-weight: 600; color: var(--color-text-muted);">Tap to hear word</span>
      </div>

      <!-- Letter Slots (Target: "WATER") -->
      <div class="slots-container">
        <div class="letter-slot">W</div>
        <div class="letter-slot">A</div>
        <div class="letter-slot slot-active"></div>
        <div class="letter-slot"></div>
        <div class="letter-slot"></div>
      </div>

      <!-- Interactive Actions -->
      <div class="modal-actions">
        <button class="btn-tactile btn-blue" style="font-size: 18px; padding: 10px 20px;">⌫ Backspace</button>
        <button class="btn-tactile btn-green" style="font-size: 18px; padding: 10px 28px;">Check Word ✨</button>
      </div>

      <!-- Cancel Action -->
      <button class="cancel-link">Cancel Action (Uses 1 Energy Point)</button>
    </div>
  </div>
</body>
</html>
