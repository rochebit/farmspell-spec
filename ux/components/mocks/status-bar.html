<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StatusBar Component Mock</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .showcase-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 32px;
    }

    /* StatusBar Container */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 253, 249, 0.95);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: var(--radius-full);
      border: 3px solid var(--color-farm-green-main);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      gap: 16px;
      flex-wrap: wrap;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Profile Pill */
    .profile-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #F1F8E9;
      padding: 6px 16px 6px 8px;
      border-radius: var(--radius-full);
      border: 2px solid var(--color-farm-green-light);
      cursor: pointer;
      transition: transform var(--duration-instant);
    }
    .profile-pill:active {
      transform: translateY(2px);
    }
    .avatar-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #C8E6C9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .profile-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text-primary);
    }

    /* Stat Badges */
    .stat-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-size: 18px;
      font-weight: 700;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    }
    .coin-pill {
      background: #FFF8E1;
      border: 2px solid var(--color-coin-gold);
      color: #E65100;
    }
    .action-pill {
      background: #E1F5FE;
      border: 2px solid var(--color-sky-blue);
      color: #0277BD;
    }
    .day-pill {
      background: #E8F5E9;
      border: 2px solid var(--color-farm-green-light);
      color: var(--color-farm-green-dark);
    }

    /* Nav Buttons */
    .icon-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
      transition: transform var(--duration-instant), box-shadow var(--duration-instant);
    }
    .icon-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="showcase-container glass-card">
    <h2>Component Mock: StatusBar</h2>
    <p style="color: var(--color-text-muted); margin: 6px 0 24px 0;">Top-level game HUD rendered on the main screen.</p>

    <!-- Interactive Mock -->
    <div class="status-bar">
      <!-- Left: Profile -->
      <div class="status-group">
        <div class="profile-pill">
          <div class="avatar-icon">🦊</div>
          <span class="profile-name">Leo</span>
        </div>
        <div class="stat-pill day-pill">
          <span>☀️</span>
          <span>Day 4</span>
        </div>
      </div>

      <!-- Center: Stats -->
      <div class="status-group">
        <div class="stat-pill coin-pill">
          <span>🪙</span>
          <span>125</span>
        </div>
        <div class="stat-pill action-pill">
          <span>⚡</span>
          <span>7 / 10 AP</span>
        </div>
      </div>

      <!-- Right: Action Buttons -->
      <div class="status-group">
        <button class="icon-btn btn-blue" title="Audio Recording Studio">🎙️</button>
        <button class="icon-btn btn-gold" title="Farm Market & Shop">🏪</button>
        <button class="icon-btn" style="background: #ECEFF1;" title="Toggle Sound">🔊</button>
      </div>
    </div>
  </div>
</body>
</html>
