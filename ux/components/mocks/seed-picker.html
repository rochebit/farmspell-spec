<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeedPicker Component Mock</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .drawer-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--color-surface-overlay);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .drawer-sheet {
      background: var(--color-surface-card);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      border-top: 4px solid var(--color-farm-green-main);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.25);
      max-width: 780px;
      width: 100%;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .seed-cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 16px;
    }

    .seed-item-card {
      background: #FFFFFF;
      border: 2px solid #D7CCC8;
      border-radius: var(--radius-md);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
      transition: transform var(--duration-instant);
    }
    .seed-item-card:hover {
      border-color: var(--color-farm-green-main);
      transform: translateY(-2px);
    }

    .seed-icon-box {
      font-size: 40px;
    }

    .seed-count-badge {
      background: var(--color-farm-green-dark);
      color: white;
      font-size: 13px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: var(--radius-full);
    }

    .seed-info-pill {
      font-size: 12px;
      color: var(--color-text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="drawer-backdrop">
    <div class="drawer-sheet">
      <div class="drawer-header">
        <div>
          <h2 style="font-size: 24px;">Choose Seed to Plant 🌱</h2>
          <span style="font-size: 14px; color: var(--color-text-muted);">Planting Plot #4</span>
        </div>
        <button class="btn-tactile" style="min-height: 44px; padding: 6px 16px; background: #ECEFF1; font-size: 16px;">✕ Close</button>
      </div>

      <div class="seed-cards-row">
        <!-- Carrot -->
        <div class="seed-item-card">
          <div class="seed-icon-box">🥕</div>
          <strong style="font-size: 16px;">Carrot</strong>
          <span class="seed-count-badge">x5 Owned</span>
          <span class="seed-info-pill">⏱️ 2 Days</span>
          <button class="btn-tactile btn-green" style="min-height: 40px; padding: 6px 16px; font-size: 15px; width: 100%;">Plant</button>
        </div>

        <!-- Tomato -->
        <div class="seed-item-card">
          <div class="seed-icon-box">🍅</div>
          <strong style="font-size: 16px;">Tomato</strong>
          <span class="seed-count-badge">x2 Owned</span>
          <span class="seed-info-pill">⏱️ 2 Days</span>
          <button class="btn-tactile btn-green" style="min-height: 40px; padding: 6px 16px; font-size: 15px; width: 100%;">Plant</button>
        </div>

        <!-- Corn -->
        <div class="seed-item-card">
          <div class="seed-icon-box">🌽</div>
          <strong style="font-size: 16px;">Corn</strong>
          <span class="seed-count-badge">x3 Owned</span>
          <span class="seed-info-pill">⏱️ 3 Days</span>
          <button class="btn-tactile btn-green" style="min-height: 40px; padding: 6px 16px; font-size: 15px; width: 100%;">Plant</button>
        </div>

        <!-- Strawberry (0 Owned) -->
        <div class="seed-item-card" style="opacity: 0.6;">
          <div class="seed-icon-box">🍓</div>
          <strong style="font-size: 16px;">Strawberry</strong>
          <span class="seed-count-badge" style="background: #9E9E9E;">x0 Owned</span>
          <span class="seed-info-pill">⏱️ 3 Days</span>
          <button class="btn-tactile btn-gold" style="min-height: 40px; padding: 6px 12px; font-size: 14px; width: 100%;">Shop</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
